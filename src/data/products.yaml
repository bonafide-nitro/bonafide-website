# Product data structure — single source of truth for BOTH product views.
# `views` decides which page renders a SKU: retail -> /products/, wholesale -> /products-2/.
# The two pages are separate launch URLs and are never merged, aliased or substituted.
# Source: docs/migration/07-block4-public-source-capture.md (sanitized public rendered-page capture).
# Deliberately NOT here (not evidenced, never invented): Amazon hrefs, unresolved store hrefs,
# the retail Vanilla store href, Alliance store hrefs, Decaf Mexico store href, image alt text
# other than where already recorded. `amazonCta: true` records only that a retail Amazon CTA
# label exists on the launch page; the href is migration-remaining.
# `links.storeViews` limits a store link to the views where it is evidenced.
# `image` paths are the same-path launch URLs; binaries are not in the repo yet (migration-remaining),
# so pages do not reference them (QA T7 requires referenced uploads to exist).

