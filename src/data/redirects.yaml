  - { id: amp-root, type: exact, from: /amp/, to: /, status: 301, state: defined }
  - { id: amp-bookingpress-params, type: pattern, from: "/amp/?bpa_page=bookingpress_download&*", to: /, status: 301, state: defined, note: "3 parameter variants" }
