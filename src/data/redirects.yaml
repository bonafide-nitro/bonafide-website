# Redirect register — DATA ONLY. Nothing here is applied to any live site; a later Block
# generates .htaccess from it (04-master-plan §10.4). 301 only, single hop, no chains.
# Sources: 04-master-plan §7.4/§7.5/§7.8, 06-stage1 report (I1, D5).
#
# state: defined            -> destination decided by the authoritative evidence
# state: pending-decision   -> evidence does not decide the destination; destination is null
#                              and MUST NOT be generated until decided (never invented here).
# state: deliberate-404     -> Block 21 (ZANETA_DECISION on Issue #60): intentionally NOT redirected at launch; the
#                              source is a real 404 on the static host. Destination is null; never emitted.
# state: dropped            -> Block 21 (ZANETA_DECISION on Issue #60): no redirect rule is emitted because no reliable
#                              mapping exists. Destination is null; never emitted. (Used for query-only `/?p=` sources,
#                              which Apache cannot 404 on the static host.)
rules:
  # --- protocol/host canonicalisation, single hop (SEO-7, §7.5) ---
  - { id: http-apex, type: canonicalisation, from: "http://bonafidenitro.com/*", to: "https://bonafidenitro.com/*", status: 301, state: defined }
  - { id: http-www, type: canonicalisation, from: "http://www.bonafidenitro.com/*", to: "https://bonafidenitro.com/*", status: 301, state: defined }
  - { id: https-www, type: canonicalisation, from: "https://www.bonafidenitro.com/*", to: "https://bonafidenitro.com/*", status: 301, state: defined }
  # --- AMP (SEO-6, §7.5) ---
  - { id: amp-pattern, type: pattern, from: "/<slug>/amp/", to: "/<slug>/", status: 301, state: defined, note: "every generated /<slug>/amp/ (29)" }
  # Exact one-hop overrides of amp-pattern (exact sources win over patterns): the generic rule would chain through
  # the booking redirects below (ZANETA_DECISION on PR #24, D5). Only these three AMP URLs are evidenced (master plan line 428).
  - { id: amp-booking-thank-you, type: exact, from: /thank-you/amp/, to: /book-appointment/, status: 301, state: defined }
