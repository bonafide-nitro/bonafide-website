name: Harness label close/merge cleanup

# Issue #171 (harness golden-path sync): "Close/merge hygiene" layer 1 of 2
# -- event-driven, idempotent removal of transient (READY_FOR_CLAUDE_CLOUD,
# READY_FOR_SANTIAGO) and retired/forbidden (controller:*, CHANGES_REQUESTED,
# SANTIAGO_REVIEWING, WORK_IN_PROGRESS, SANTIAGO_STALLED, CLAUDE_DISPATCHED,
# CLAUDE_WORKING, CLAUDE_STALLED, historical literal NEEDS_ZANETA,
# CORRECTION_IN_PROGRESS) labels the moment an Issue/PR closes or merges.
# See docs/HARNESS_GOLDEN_PATH.md and
# .github/scripts/harness_labels.py/harness_label_close_cleanup.py (the
# offline-tested unit -- this file only decides when to run it and with
# what permissions).
#
# REMOVAL-ONLY, NEVER A PARTICIPANT IN THE PROTOCOL ITSELF: this workflow
# never adds a label, posts a comment, reopens an item, requeues Claude, or
# wakes Codex -- see .github/scripts/harness_label_close_cleanup.py's own
# module docstring. It never touches VERIFIED, COMPLETED, or any ordinary
# product/client/non-harness label, and it re-checks the item is still
# CLOSED immediately before writing (defense in depth against a race with a
# reopen).
#
# TRUSTED CODE ONLY IN THE CLEANUP STEP -- same reasoning as every other
# label-writing workflow in this set (see claude-cloud-routine-bridge.yml's
# own header): `pull_request: closed` can fire on a PR whose head is not
# this repository's own trusted revision, so the checkout below pins an
# explicit ref to this repository's own default branch, for both `issues`
# and `pull_request` events alike, with `persist-credentials: false`.
# `actions/checkout` is pinned to the same immutable commit SHA already
# verified (via `git ls-remote`) for the other workflows in this set.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: harness-label-close-cleanup-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this repository's own trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Determine issue/PR flag
        id: item
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "flag=--issue" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove transient/retired labels from this now-closed item
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/harness_label_close_cleanup.py \
            --repo "${{ github.repository }}" \
            ${{ steps.item.outputs.flag }} "${{ github.event.issue.number || github.event.pull_request.number }}"
