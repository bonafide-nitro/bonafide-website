name: Owner local preview package

# Block 54 (Issue #124). Builds the Astro site and packages it as a downloadable, LOCAL-ONLY preview.
# Repository artifact only: read-only token, no secrets, no environment, no hosting/Pages/deploy step.
# The download is private to people with repository access and expires after 14 days.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies (deterministic)
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Forbidden-string guard on dist/
        run: npm run check:dist
      - name: Release-artifact preflight on dist/
        run: npm run check:artifact
      - name: Package local preview zip
        run: npm run package:preview
      - name: Offline release rehearsal on the packaged zip
        run: npm run rehearse:release
      - name: Install Apache for the end-to-end rehearsal (loopback only; no host access)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apache2 && sudo systemctl stop apache2 || true
      - name: Offline Apache rehearsal on the packaged zip (Issue #162)
        run: npm run rehearse:apache
      - name: Rollback package and fail-closed preflight (Issue #162)
        run: npm run rollback:preflight
      - name: Rollback and Apache rehearsal tests (Apache required)
        run: REQUIRE_APACHE=1 node --test tests/foundation/block162-apache-rehearsal.test.mjs tests/foundation/block162-rollback-package.test.mjs
      - name: Verify zip contents
        run: |
          unzip -l preview-out/bonafide-preview.zip | grep -E 'Open-Preview.command|READ-ME-FIRST.txt|PREVIEW-INFO.json|site/index.html'
          unzip -Z preview-out/bonafide-preview.zip bonafide-preview/Open-Preview.command | grep -- '^-rwx'
      - uses: actions/upload-artifact@v4
        with:
          name: bonafide-local-preview-${{ github.sha }}
          path: preview-out/bonafide-preview.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bonafide-rollback-package-${{ github.sha }}
          path: rollback-out/
          if-no-files-found: error
          retention-days: 14
