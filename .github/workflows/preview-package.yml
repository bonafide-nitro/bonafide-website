name: Owner local preview package

# Block 54 (Issue #124). Builds the Astro site and packages it as a downloadable, LOCAL-ONLY preview.
# Repository artifact only: read-only token, no secrets, no environment, no hosting/Pages/deploy step.
# The download is private to people with repository access and expires after 14 days.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies (deterministic)
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Forbidden-string guard on dist/
        run: npm run check:dist
      - name: Release-artifact preflight on dist/
        run: npm run check:artifact
      - name: Package local preview zip
        run: npm run package:preview
      - name: Verify zip contents
        run: |
          unzip -l preview-out/bonafide-preview.zip | grep -E 'Open-Preview.command|READ-ME-FIRST.txt|PREVIEW-INFO.json|site/index.html'
          unzip -Z preview-out/bonafide-preview.zip bonafide-preview/Open-Preview.command | grep -- '^-rwx'
      - uses: actions/upload-artifact@v4
        with:
          name: bonafide-local-preview-${{ github.sha }}
          path: preview-out/bonafide-preview.zip
          if-no-files-found: error
          retention-days: 14
